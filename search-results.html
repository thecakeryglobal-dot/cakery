<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Search products from The Cakery, Kannur.">

  <title>Search Products | The Cakery</title>

  <style>
    @font-face {
      font-family: "Metropolis";
      src: url("./assets/metropolis-regular.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --green-dark: #04251c;
      --green: #073b2d;
      --green-light: #0a4a38;

      --cream: #fff9ef;
      --cream-soft: #f3e5ca;
      --cream-border: #e7cf9d;

      --text-soft: rgba(255, 249, 239, 0.75);
      --text-muted: rgba(255, 249, 239, 0.58);

      --border: rgba(255, 249, 239, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(231, 207, 157, 0.12),
          transparent 28rem
        ),
        linear-gradient(
          145deg,
          var(--green-dark),
          var(--green)
        );

      color: var(--cream);
      font-family: "Metropolis", Arial, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
      padding: 32px 0 80px;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 80px;
    }

    .logo img {
      width: 175px;
      height: auto;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 9px 16px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: var(--cream-soft);

      font-size: 0.84rem;
      font-weight: 600;

      transition: 0.25s ease;
    }

    .header-link:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(231, 207, 157, 0.45);
      transform: translateY(-2px);
    }

    /* =========================
       HERO
    ========================= */

    .eyebrow {
      color: var(--cream-border);

      font-size: 0.72rem;
      font-weight: 600;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 900px;

      margin-top: 14px;

      font-size: clamp(2.8rem, 7vw, 6rem);
      line-height: 0.95;

      letter-spacing: -0.06em;
    }

    .intro {
      max-width: 650px;

      margin-top: 18px;

      color: var(--text-soft);

      font-size: 1rem;
    }

    .search-value {
      display: inline-flex;

      margin-top: 22px;
      padding: 8px 14px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.04);

      color: var(--cream-soft);

      font-size: 0.82rem;
      font-weight: 600;
    }

    /* =========================
       SECTION
    ========================= */

    .results-section {
      margin-top: 65px;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
      padding-bottom: 14px;

      border-bottom: 1px solid var(--border);
    }

    .section-title {
      color: var(--cream-soft);

      font-size: 0.78rem;
      font-weight: 600;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .result-count {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* =========================
       PRODUCT GRID
    ========================= */

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 22px;
    }

    /* =========================
       PRODUCT CARD
    ========================= */

    .product-card {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 26px;

      background: rgba(5, 43, 33, 0.88);

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-7px);

      border-color:
        rgba(231, 207, 157, 0.45);

      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.28);
    }

    .product-image-wrapper {
      position: relative;

      overflow: hidden;

      aspect-ratio: 1.15 / 1;

      background: var(--green-light);
    }

    .product-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.55s
        cubic-bezier(0.2, 0.75, 0.25, 1);
    }

    .product-card:hover .product-image {
      transform: scale(1.05);
    }

    .product-tag {
      position: absolute;

      top: 12px;
      left: 12px;

      padding: 6px 10px;

      border-radius: 999px;

      background:
        rgba(4, 37, 28, 0.86);

      border: 1px solid
        rgba(255, 255, 255, 0.2);

      color: var(--cream);

      font-size: 0.65rem;
      font-weight: 600;

      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .product-body {
      padding: 20px;
    }

    .product-title-row {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 15px;
    }

    .product-name {
      color: var(--cream);

      font-size: 1.25rem;
      font-weight: 600;

      line-height: 1.25;
    }

    .product-price {
      flex-shrink: 0;

      color: var(--cream-soft);

      font-size: 0.88rem;
      font-weight: 700;
    }

    .product-description {
      margin-top: 11px;

      color: var(--text-muted);

      font-size: 0.88rem;
    }

    .product-actions {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-top: 20px;
    }

    .order-button {
      color: var(--cream);

      font-size: 0.84rem;
      font-weight: 600;
    }

    .order-button:hover {
      color: var(--cream-border);
    }

    .cart-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 40px;

      padding: 8px 15px;

      border-radius: 999px;

      background: var(--cream-soft);

      color: var(--green-dark);

      font-size: 0.78rem;
      font-weight: 700;

      transition: 0.25s ease;
    }

    .cart-button:hover {
      background: var(--cream);
      transform: translateY(-2px);
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      padding: 55px 25px;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.04);

      text-align: center;
    }

    .empty-icon {
      margin-bottom: 12px;

      font-size: 2.2rem;
    }

    .empty-state h2 {
      font-size: 1.4rem;
    }

    .empty-state p {
      max-width: 500px;

      margin: 10px auto 22px;

      color: var(--text-muted);

      font-size: 0.9rem;
    }

    .products-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 44px;

      padding: 10px 18px;

      border-radius: 999px;

      background: var(--cream-soft);

      color: var(--green-dark);

      font-size: 0.82rem;
      font-weight: 700;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      grid-column: 1 / -1;

      padding: 60px 20px;

      color: var(--text-muted);

      text-align: center;
    }

    .loading span {
      display: inline-block;

      width: 8px;
      height: 8px;

      margin: 0 4px;

      border-radius: 50%;

      background: var(--cream-border);

      animation: loading 0.8s
        infinite alternate;
    }

    .loading span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes loading {
      from {
        opacity: 0.25;
        transform: translateY(0);
      }

      to {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 950px) {
      .product-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .page {
        width: calc(100% - 28px);
        padding-top: 24px;
        padding-bottom: 55px;
      }

      .topbar {
        align-items: flex-start;

        flex-direction: column;

        margin-bottom: 55px;
      }

      .header-links {
        width: 100%;

        justify-content: space-between;
      }

      .product-grid {
        grid-template-columns: 1fr;

        gap: 16px;
      }

      h1 {
        font-size: clamp(
          2.4rem,
          12vw,
          4rem
        );
      }

      .results-section {
        margin-top: 48px;
      }
    }

    @media (max-width: 480px) {
      .page {
        width: calc(100% - 22px);
      }

      .logo img {
        width: 135px;
      }

      .header-link {
        min-height: 40px;

        padding: 8px 13px;

        font-size: 0.76rem;
      }

      .intro {
        font-size: 0.9rem;
      }

      .search-value {
        font-size: 0.75rem;
      }

      .section-header {
        align-items: flex-start;

        flex-direction: column;

        gap: 5px;
      }

      .product-card {
        border-radius: 21px;
      }

      .product-body {
        padding: 17px;
      }

      .product-name {
        font-size: 1.08rem;
      }

      .product-price {
        font-size: 0.8rem;
      }

      .product-description {
        font-size: 0.82rem;
      }
    }

    @media (hover: none) {
      .product-card:hover {
        transform: none;
      }

      .product-card:hover .product-image {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;

        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <!-- HEADER -->

    <header class="topbar">

      <a
        class="logo"
        href="./index.html"
        aria-label="The Cakery Home"
      >

        <img
          src="./assets/cakery-logo-transparent.png"
          alt="The Cakery"
        >

      </a>


      <div class="header-links">

        <a
          class="header-link"
          href="./products.html"
        >
          ← All Products
        </a>

        <a
          class="header-link"
          href="./cart.html"
        >
          Cart →
        </a>

      </div>

    </header>


    <!-- HERO -->

    <section>

      <span class="eyebrow">
        The Cakery · Kannur
      </span>

      <h1 id="page-title">
        Search Results
      </h1>

      <p
        class="intro"
        id="intro-text"
      >
        Searching through all available products...
      </p>

      <span
        class="search-value"
        id="search-value"
      ></span>

    </section>


    <!-- RESULTS -->

    <section class="results-section">

      <div class="section-header">

        <p class="section-title">
          Matching Products
        </p>

        <span
          class="result-count"
          id="result-count"
        ></span>

      </div>


      <div
        class="product-grid"
        id="results"
      >

        <div class="loading">

          <span></span>
          <span></span>
          <span></span>

        </div>

      </div>

    </section>


    <!-- RELATED PRODUCTS -->

    <section
      class="results-section"
      id="related-section"
      style="display: none;"
    >

      <div class="section-header">

        <p class="section-title">
          You May Also Like
        </p>

        <span class="result-count">
          More from The Cakery
        </span>

      </div>


      <div
        class="product-grid"
        id="related-products"
      ></div>

    </section>

  </main>


  <script>

    /*
      =====================================================
      THE CAKERY PRODUCT SEARCH
      =====================================================

      This page reads the REAL product cards from:

          products.html

      Therefore:

          Product Name
          Product Image
          Price
          Description
          Category
          Add To Cart Link
          Order Link

      all come from the same product card.

      No generic images are used.
      =====================================================
    */


    (function () {

      "use strict";


      /* -----------------------------------------------
         GET HTML ELEMENTS
      ------------------------------------------------ */

      const resultsContainer =
        document.getElementById("results");

      const relatedContainer =
        document.getElementById("related-products");

      const relatedSection =
        document.getElementById("related-section");

      const pageTitle =
        document.getElementById("page-title");

      const introText =
        document.getElementById("intro-text");

      const searchValue =
        document.getElementById("search-value");

      const resultCount =
        document.getElementById("result-count");


      /* -----------------------------------------------
         GET SEARCH QUERY
      ------------------------------------------------ */

      const urlParams =
        new URLSearchParams(
          window.location.search
        );

      const originalQuery =
        urlParams.get("q") || "";


      const query =
        originalQuery.trim();


      /* -----------------------------------------------
         NORMALIZE TEXT
      ------------------------------------------------ */

      function normalizeText(text) {

        return String(text || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          )
          .replace(
            /[^a-z0-9]+/g,
            " "
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim();

      }


      const normalizedQuery =
        normalizeText(query);


      /* -----------------------------------------------
         SHOW SEARCH TEXT
      ------------------------------------------------ */

      if (query) {

        searchValue.textContent =
          'Search: "' + query + '"';

      } else {

        searchValue.textContent =
          "No search term";

      }


      /* -----------------------------------------------
         ESCAPE HTML
      ------------------------------------------------ */

      function escapeHTML(text) {

        return String(text || "")
          .replace(
            /[&<>"']/g,
            function (character) {

              const characters = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
              };

              return characters[character];

            }
          );

      }


      /* -----------------------------------------------
         LOAD PRODUCTS FROM products.html
      ------------------------------------------------ */

      async function getProducts() {

        const response =
          await fetch(
            "./products.html",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Could not load products.html"
          );

        }


        const html =
          await response.text();


        const parser =
          new DOMParser();


        const productDocument =
          parser.parseFromString(
            html,
            "text/html"
          );


        /*
          IMPORTANT:

          Your products.html uses:

          .product-card

          So we collect every product card.
        */

        const cards =
          Array.from(
            productDocument.querySelectorAll(
              ".product-card"
            )
          );


        return cards
          .map(function (card) {


            /*
              PRODUCT IMAGE
            */

            const imageElement =
              card.querySelector(
                ".product-image"
              );


            /*
              PRODUCT NAME
            */

            const nameElement =
              card.querySelector(
                ".product-title-row h3"
              );


            /*
              PRICE
            */

            const priceElement =
              card.querySelector(
                ".price"
              );


            /*
              DESCRIPTION
            */

            const descriptionElement =
              card.querySelector(
                ".product-info > p"
              );


            /*
              CATEGORY
            */

            const categoryElement =
              card.querySelector(
                ".category-tag"
              );


            /*
              BADGE
            */

            const badgeElement =
              card.querySelector(
                ".product-badge"
              );


            /*
              ADD TO CART
            */

            const cartElement =
              card.querySelector(
                ".add-button"
              );


            /*
              ORDER
            */

            const orderElement =
              card.querySelector(
                ".order-link"
              );


            /*
              If product doesn't have
              image or name, ignore it.
            */

            if (
              !imageElement ||
              !nameElement
            ) {

              return null;

            }


            return {

              name:
                nameElement.textContent.trim(),

              normalizedName:
                normalizeText(
                  nameElement.textContent
                ),

              image:
                imageElement.getAttribute(
                  "src"
                ) || "",

              imageAlt:
                imageElement.getAttribute(
                  "alt"
                ) ||
                nameElement.textContent.trim(),

              price:
                priceElement
                  ? priceElement.textContent.trim()
                  : "",

              description:
                descriptionElement
                  ? descriptionElement.textContent.trim()
                  : "",

              category:
                categoryElement
                  ? categoryElement.textContent.trim()
                  : card.getAttribute("data-cake-category") || "",

              badge:
                badgeElement
                  ? badgeElement.textContent.trim()
                  : "",

              cartLink:
                cartElement
                  ? cartElement.getAttribute(
                      "href"
                    )
                  : "./cart.html",

              orderLink:
                orderElement
                  ? orderElement.getAttribute(
                      "href"
                    )
                  : "./index.html#order"

            };

          })
          .filter(Boolean);

      }


      /* -----------------------------------------------
         SEARCH PRODUCTS
      ------------------------------------------------ */

      function searchProducts(
        products
      ) {

        if (!normalizedQuery) {

          return [];

        }


        const words =
          normalizedQuery
            .split(" ")
            .filter(Boolean);


        const matches = [];


        products.forEach(
          function (product) {


            const productName =
              product.normalizedName;


            let score = 0;


            /*
              EXACT NAME

              Example:

              search:
              Choco Pista

              product:
              Choco Pista

              Highest priority.
            */

            if (
              productName ===
              normalizedQuery
            ) {

              score = 1000;

            }


            /*
              PRODUCT NAME STARTS WITH SEARCH
            */

            else if (
              productName.startsWith(
                normalizedQuery
              )
            ) {

              score = 900;

            }


            /*
              PRODUCT NAME CONTAINS SEARCH
            */

            else if (
              productName.includes(
                normalizedQuery
              )
            ) {

              score = 800;

            }


            /*
              INDIVIDUAL WORD MATCH
            */

            else {

              let matchedWords = 0;


              words.forEach(
                function (word) {

                  if (
                    productName
                      .split(" ")
                      .some(
                        function (productWord) {

                          return (
                            productWord === word ||
                            productWord.includes(word) ||
                            word.includes(productWord)
                          );

                        }
                      )
                  ) {

                    matchedWords++;

                  }

                }
              );


              if (
                matchedWords > 0
              ) {

                score =
                  500 +
                  matchedWords * 50;

              }

            }


            /*
              CATEGORY / DESCRIPTION MATCH

              Lower priority than product name.
            */

            if (
              score === 0
            ) {

              const searchableText =
                normalizeText(
                  product.description +
                  " " +
                  product.category
                );


              if (
                searchableText.includes(
                  normalizedQuery
                )
              ) {

                score = 100;

              }

            }


            if (
              score > 0
            ) {

              matches.push({

                product: product,

                score: score

              });

            }

          }
        );


        /*
          HIGHEST MATCH FIRST
        */

        matches.sort(
          function (a, b) {

            return b.score - a.score;

          }
        );


        return matches.map(
          function (item) {

            return item.product;

          }
        );

      }


      /* -----------------------------------------------
         CREATE PRODUCT CARD
      ------------------------------------------------ */

      function createProductCard(
        product
      ) {

        const name =
          escapeHTML(
            product.name
          );


        const image =
          product.image;


        const imageAlt =
          escapeHTML(
            product.imageAlt
          );


        const price =
          escapeHTML(
            product.price
          );


        const description =
          escapeHTML(
            product.description
          );


        const category =
          escapeHTML(
            product.category
          );


        const cartLink =
          product.cartLink ||
          "./cart.html";


        const orderLink =
          product.orderLink ||
          "./index.html#order";


        return `

          <article class="product-card">

            <div class="product-image-wrapper">

              <img
                class="product-image"
                src="${image}"
                alt="${imageAlt}"
                loading="lazy"
                decoding="async"
              >

              ${
                category
                  ? `
                    <span class="product-tag">
                      ${category}
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="product-body">

              <div class="product-title-row">

                <h2 class="product-name">
                  ${name}
                </h2>

                ${
                  price
                    ? `
                      <span class="product-price">
                        ${price}
                      </span>
                    `
                    : ""
                }

              </div>


              ${
                description
                  ? `
                    <p class="product-description">
                      ${description}
                    </p>
                  `
                  : ""
              }


              <div class="product-actions">

                <a
                  class="order-button"
                  href="${orderLink}"
                >
                  Order
                </a>

                <a
                  class="cart-button"
                  href="${cartLink}"
                >
                  Add to cart
                </a>

              </div>

            </div>

          </article>

        `;

      }


      /* -----------------------------------------------
         EMPTY RESULT
      ------------------------------------------------ */

      function showNoResult() {

        resultsContainer.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🍰
            </div>

            <h2>
              No product found
            </h2>

            <p>
              We couldn't find a product matching
              "${escapeHTML(query)}".
              Try searching using the exact product name.
            </p>

            <a
              class="products-button"
              href="./products.html"
            >
              View All Products
            </a>

          </div>

        `;

      }


      /* -----------------------------------------------
         SHOW LOAD ERROR
      ------------------------------------------------ */

      function showLoadError() {

        const errorMessage =
          window.location.protocol === "file:"
            ? "Open this page through a local web server (for example, VS Code Live Server). Browsers block loading products.html when this page is opened directly as a file."
            : "Please make sure products.html is available in the same folder as search-results.html.";

        resultsContainer.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              ⚠️
            </div>

            <h2>
              Products couldn't be loaded
            </h2>

            <p>
              ${errorMessage}
            </p>

            <a
              class="products-button"
              href="./products.html"
            >
              Open Products
            </a>

          </div>

        `;

      }


      /* -----------------------------------------------
         MAIN SEARCH
      ------------------------------------------------ */

      async function runSearch() {


        /*
          NO SEARCH TERM
        */

        if (!normalizedQuery) {

          pageTitle.textContent =
            "Search Products";

          introText.textContent =
            "Search for a product name to find the exact product from The Cakery.";

          resultCount.textContent =
            "No search term";

          showNoResult();

          relatedSection.style.display =
            "none";

          return;

        }


        let products;


        /*
          LOAD ACTUAL PRODUCTS
        */

        try {

          products =
            await getProducts();

        } catch (error) {

          console.error(
            "The Cakery search error:",
            error
          );

          pageTitle.textContent =
            "Search Error";

          introText.textContent =
            "We couldn't load the product catalog.";

          resultCount.textContent =
            "";

          showLoadError();

          relatedSection.style.display =
            "none";

          return;

        }


        /*
          NO PRODUCTS FOUND IN products.html
        */

        if (
          products.length === 0
        ) {

          pageTitle.textContent =
            "No Products";

          introText.textContent =
            "No product cards were found in products.html.";

          resultCount.textContent =
            "0 products";

          showLoadError();

          relatedSection.style.display =
            "none";

          return;

        }


        /*
          SEARCH
        */

        const matches =
          searchProducts(
            products
          );


        /*
          NOTHING MATCHED
        */

        if (
          matches.length === 0
        ) {

          pageTitle.textContent =
            "No Product Found";

          introText.textContent =
            'No product matched "' +
            query +
            '".';

          resultCount.textContent =
            "0 products";

          showNoResult();

          /*
            Show a few real products
            as recommendations.
          */

          const recommendations =
            products.slice(0, 3);


          if (
            recommendations.length
          ) {

            relatedContainer.innerHTML =
              recommendations
                .map(
                  createProductCard
                )
                .join("");

            relatedSection.style.display =
              "block";

          }


          document.title =
            "Search: " +
            query +
            " | The Cakery";


          return;

        }


        /*
          EXACT / BEST MATCH
        */

        const bestProduct =
          matches[0];


        pageTitle.textContent =
          bestProduct.name;


        introText.textContent =
          "We found the matching product from The Cakery's actual product catalog.";


        resultCount.textContent =
          matches.length +
          " matching product" +
          (
            matches.length === 1
              ? ""
              : "s"
          );


        /*
          SHOW BEST MATCH FIRST

          The image here comes directly
          from the SAME product card
          in products.html.
        */

        resultsContainer.innerHTML =
          createProductCard(
            bestProduct
          );


        /*
          RELATED MATCHES

          If user searches "choco",
          other products containing
          "choco" can appear here.
        */

        const relatedMatches =
          matches.slice(1, 4);


        if (
          relatedMatches.length > 0
        ) {

          relatedContainer.innerHTML =
            relatedMatches
              .map(
                createProductCard
              )
              .join("");

          relatedSection.style.display =
            "block";

        } else {

          /*
            If there are no other
            matching products, show
            products from the same
            category.
          */

          const category =
            normalizeText(
              bestProduct.category
            );


          const categoryProducts =
            products
              .filter(
                function (product) {

                  return (
                    product.name !==
                    bestProduct.name
                  );

                }
              )
              .filter(
                function (product) {

                  if (!category) {

                    return true;

                  }

                  return (
                    normalizeText(
                      product.category
                    ) === category
                  );

                }
              )
              .slice(0, 3);


          if (
            categoryProducts.length
          ) {

            relatedContainer.innerHTML =
              categoryProducts
                .map(
                  createProductCard
                )
                .join("");

            relatedSection.style.display =
              "block";

          } else {

            relatedSection.style.display =
              "none";

          }

        }


        /*
          UPDATE PAGE TITLE
        */

        document.title =
          bestProduct.name +
          " | The Cakery";

      }


      /* -----------------------------------------------
         START
      ------------------------------------------------ */

      runSearch();

    })();

  </script>
