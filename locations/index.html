<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find The Cakery outlets in Kannur and Taliparamba." />
    <link rel="canonical" href="https://thecakery.in/locations/" />
    <link rel="icon" href="/assets/Cakery-fav-icon.png" />
    <title>Our Locations | The Cakery</title>
    <style>
      @font-face {
        font-family: "Metropolis";
        src: url("/assets/Fonts Used/metropolis-regular.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --green-900: #04251c;
        --green-800: #073b2d;
        --beige-100: #fff9ef;
        --beige-200: #f3e5ca;
        --text-soft: rgba(255, 250, 244, 0.72);
        --border: rgba(255, 250, 244, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 25%, rgba(19, 91, 67, 0.48), transparent 55%),
          var(--green-900);
        color: var(--beige-100);
        font-family: "Metropolis", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page-shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        min-height: 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid var(--border);
      }

      .brand img {
        display: block;
        width: clamp(138px, 18vw, 190px);
        height: auto;
      }

      .back-link {
        color: var(--text-soft);
        transition: color 200ms ease;
      }

      .back-link:hover,
      .back-link:focus-visible {
        color: var(--beige-100);
      }

      main {
        padding: clamp(56px, 9vw, 100px) 0 80px;
      }

      .intro {
        max-width: 650px;
        margin: 0 auto 44px;
        text-align: center;
      }

      .eyebrow {
        color: var(--beige-200);
        font-size: 0.76rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .intro p {
        margin: 0;
        color: var(--text-soft);
        font-size: 1.05rem;
      }

      .location-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px;
      }

      .location-button {
        display: grid;
        width: min(320px, 100%);
        min-height: 84px;
        align-content: center;
        padding: 14px 22px;
        border: 1px solid transparent;
        border-radius: 18px;
        background: var(--beige-200);
        color: var(--green-900);
        text-align: center;
        transition: transform 200ms ease, background 200ms ease;
      }

      .location-button strong {
        font-size: 1.05rem;
      }

      .location-button span {
        margin-top: 2px;
        font-size: 0.82rem;
        opacity: 0.72;
      }

      .location-button:hover,
      .location-button:focus-visible {
        transform: translateY(-2px);
        background: var(--beige-100);
      }

      .location-button:focus-visible,
      .back-link:focus-visible {
        outline: 2px solid var(--beige-100);
        outline-offset: 4px;
      }

      @media (max-width: 680px) {
        .page-shell {
          width: min(1120px, calc(100% - 32px));
        }

        .site-header {
          min-height: 76px;
        }

        main {
          padding-top: 70px;
        }

        .location-actions {
          flex-direction: column;
          align-items: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="The Cakery home">
          <img src="/assets/cakery-logo-transparent.png" alt="The Cakery" />
        </a>
        <a class="back-link" href="/">Back to home</a>
      </header>

      <main>
        <div class="intro">
          <span class="eyebrow">The Cakery</span>
          <h1>Visit our locations</h1>
          <p>Choose a Cakery outlet and open directions in Google Maps.</p>
        </div>

        <div class="location-actions" role="group" aria-label="The Cakery locations">
          <a class="location-button" href="https://www.google.com/maps/place/The+Cakery/@11.8709391,75.3581511,17z/data=!3m1!4b1!4m6!3m5!1s0x3ba43d001789dff7:0xc208d4a071e9db2e!8m2!3d11.8709339!4d75.360726!16s%2Fg%2F11njfgp162?authuser=0&amp;entry=ttu&amp;g_ep=EgoyMDI2MTAwNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" aria-label="Open The Cakery Kannur in Google Maps">
            <strong>Kannur</strong>
            <span>Open in Google Maps</span>
          </a>
          <a class="location-button" href="https://www.google.com/maps/place/The+Cakery,+Taliparamba/@12.0418126,75.3616029,17z/data=!3m1!4b1!4m6!3m5!1s0x3ba43f002e11816b:0x3c5f12e0c2ec7258!8m2!3d12.0418074!4d75.3641778!16s%2Fg%2F11zdbv_xpz?authuser=0&amp;entry=ttu&amp;g_ep=EgoyMDI2MTAwNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" aria-label="Open The Cakery Taliparamba in Google Maps">
            <strong>Taliparamba</strong>
            <span>Open in Google Maps</span>
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
